<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Industrial dark hexagon structure with data nodes -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35B6C8" />
      <stop offset="100%" stop-color="#245B8F" />
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49764" />
      <stop offset="100%" stop-color="#B77A45" />
    </linearGradient>
  </defs>

  <!-- Dark Navy Base Shield/Hexagon -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#101D2D" stroke="#1E3752" stroke-width="2"/>

  <!-- Geometric Crystal / Data Flow Lines -->
  <path d="M32 4 L32 32 M58 18 L32 32 M58 46 L32 32 M32 60 L32 32 M6 46 L32 32 M6 18 L32 32" stroke="#245B8F" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Inner Diamond / Mineral Facet -->
  <polygon points="32,16 46,32 32,48 18,32" fill="url(#grad1)" fill-opacity="0.25" stroke="#35B6C8" stroke-width="2"/>

  <!-- Data Core Nodes -->
  <circle cx="32" cy="32" r="6" fill="url(#copperGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="32" cy="16" r="3.5" fill="#35B6C8"/>
  <circle cx="46" cy="32" r="3.5" fill="#3685C5"/>
  <circle cx="32" cy="48" r="3.5" fill="#35B6C8"/>
  <circle cx="18" cy="32" r="3.5" fill="#3685C5"/>
</svg>
